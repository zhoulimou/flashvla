policy:
  type: pi05-flashvla
  pretrained_path: /home/data/flashvla/weights/prod50k
  push_to_hub: false
  dtype: bfloat16
  device: npu
  state_cond: false
  num_buffer_slots: 4
  chunk_size: 10
  freeze_vision_encoder: false
  tokenizer_max_length: 32
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: local/libero_pro_flip
  root: /home/data/libero-pro/pro-train/mr_test/shard0
