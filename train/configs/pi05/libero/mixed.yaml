# Mixed fine-tune: LIBERO (downscaled to 128) + 240 clean Pro trajectories (~83:17 by frames).
policy:
  type: pi05-flashvla
  pretrained_path: /home/data/flashvla/weights/prod50k
  push_to_hub: false
  dtype: bfloat16
  device: npu
  state_cond: false
  num_buffer_slots: 4
  chunk_size: 10
  freeze_vision_encoder: false
  tokenizer_max_length: 32
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: local/libero128
  root: /home/data/libero-pro/pro-train/libero128
  video_backend: pyav

robotwin_multitask:
  enable: true
  roots:
    - /home/data/libero-pro/pro-train/libero128
    - /home/data/libero-pro/pro-train/prosmall

output_dir: /home/data/flashvla/train_mixed
job_name: mixed
batch_size: 4
grad_accum_steps: 8
steps: 2000
num_workers: 8
seed: 1000

fsdp:
  enable: false

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-6
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 10.0
  eps: 1.0e-8

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 200
  peak_lr: 5.0e-6
  decay_lr: 5.0e-7
  num_decay_steps: 2000

save_checkpoint: true
save_freq: 500
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 0

log_freq: 50
eval_freq: 2000
wandb:
  enable: false
  project: flashvla-libero
  entity: null
  disable_artifact: true
