# Fine-tune prod50k (50k-step Ascend checkpoint) on LIBERO-Pro sampled demos.
# Single arm: Pro-only data, to measure (a) Pro test gain, (b) LIBERO regression.
policy:
  type: pi05-flashvla
  pretrained_path: /home/data/flashvla/weights/prod50k
  push_to_hub: false
  dtype: bfloat16
  device: npu
  state_cond: false
  num_buffer_slots: 4
  chunk_size: 10
  freeze_vision_encoder: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: HuggingfaceVLA/libero
  root: /home/data/flashvla/datasets/libero
  video_backend: pyav
  use_imagenet_stats: true

output_dir: /home/data/flashvla/loss_probe_prod50k
job_name: loss_probe_prod50k
batch_size: 4
grad_accum_steps: 8
steps: 5
num_workers: 8
seed: 1000

fsdp:
  enable: false

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1.0e-8
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 10.0
  eps: 1.0e-8

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1
  peak_lr: 1.0e-8
  decay_lr: 1.0e-8
  num_decay_steps: 5

save_checkpoint: false
save_freq: 1000
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 0

log_freq: 1
eval_freq: 20000
wandb:
  enable: false
  project: flashvla-libero
  entity: null
  disable_artifact: true
