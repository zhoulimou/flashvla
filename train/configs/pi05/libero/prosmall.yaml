# Small-sample Pro fine-tune (8 BASE tasks x 30 demos = 240 trajectories), flipped images.
policy:
  type: pi05-flashvla
  pretrained_path: /home/data/flashvla/weights/prod50k
  push_to_hub: false
  dtype: bfloat16
  device: npu
  state_cond: false
  num_buffer_slots: 4
  chunk_size: 10
  freeze_vision_encoder: false
  tokenizer_max_length: 32
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: local/libero_pro_small
  root: /home/data/libero-pro/pro-train/prosmall
  video_backend: pyav

output_dir: /home/data/flashvla/train_prosmall
job_name: prosmall
batch_size: 4
grad_accum_steps: 8
steps: 800
num_workers: 8
seed: 1000

fsdp:
  enable: false

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 2.5e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 10.0
  eps: 1.0e-8

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 100
  peak_lr: 2.5e-5
  decay_lr: 2.5e-6
  num_decay_steps: 800

save_checkpoint: true
save_freq: 200
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 0

log_freq: 50
eval_freq: 800
wandb:
  enable: false
  project: flashvla-libero
  entity: null
  disable_artifact: true
