# LoRA smoke: vanilla pi0.5 arm, prosmall data, 20 steps
policy:
  type: pi05
  pretrained_path: /home/data/flashvla/weights/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: npu
  state_cond: false
  chunk_size: 50
  n_action_steps: 50
  freeze_vision_encoder: false
  tokenizer_max_length: 32
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: local/libero_pro_small
  root: /home/data/libero-pro/pro-train/prosmall
  video_backend: pyav

output_dir: /home/data/flashvla/train_smoke_lora_van
job_name: smoke_lora_van
batch_size: 1
grad_accum_steps: 1
steps: 20
num_workers: 4
seed: 1000

fsdp:
  enable: false

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 10.0
  eps: 1.0e-8

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 5
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  num_decay_steps: 20

save_checkpoint: true
save_freq: 20
checkpoint_keep_last: 1
checkpoint_keep_every_n_steps: 0
log_freq: 1
eval_freq: 0
wandb:
  enable: false
