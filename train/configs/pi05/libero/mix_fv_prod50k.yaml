# LoRA smoke: FlashVLA arm, prosmall data, 20 steps
policy:
  type: pi05-flashvla
  pretrained_path: /home/data/flashvla/weights/prod50k
  push_to_hub: false
  dtype: bfloat16
  device: npu
  state_cond: false
  num_buffer_slots: 4
  chunk_size: 10
  freeze_vision_encoder: false
  tokenizer_max_length: 32
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: local/pro_mixed1600
  root: /home/data/libero-pro/pro-train/pro_mixed1600
  video_backend: pyav

output_dir: /home/data/flashvla/train_mix_fv_prod50k
job_name: mix_fv_prod50k
batch_size: 16
grad_accum_steps: 1
steps: 2500
num_workers: 4
seed: 1000

fsdp:
  enable: false

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 10.0
  eps: 1.0e-8

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 100
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  num_decay_steps: 2500

save_checkpoint: true
save_freq: 500
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 0
log_freq: 50
eval_freq: 800
wandb:
  enable: false
